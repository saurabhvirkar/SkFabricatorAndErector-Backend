version: '3.8'

services:
  api-qa:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-skfabricator-api}:qa-${IMAGE_TAG:-latest}
    container_name: skfabricator-api-qa
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=QA
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=${POSTGRES_QA_CONN_STR}
      - Jwt__Issuer=${JWT_QA_ISSUER:-https://api-qa.skfabricator.com}
      - Jwt__Audience=${JWT_QA_AUDIENCE:-skfabricator-qa-client}
      - Jwt__Key=${JWT_QA_SECRET}
      - CloudinarySettings__CloudName=${CLOUDINARY_QA_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_QA_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_QA_API_SECRET}
      - CloudinarySettings__Folder=sk-fabricator/qa
      - SmtpSettings__Username=${SMTP_QA_USERNAME}
      - SmtpSettings__Password=${SMTP_QA_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
