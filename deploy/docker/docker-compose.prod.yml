version: '3.8'

services:
  api-prod:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-skfabricator-api}:prod-${IMAGE_TAG:-latest}
    container_name: skfabricator-api-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=${POSTGRES_PROD_CONN_STR}
      - Jwt__Issuer=${JWT_PROD_ISSUER:-https://api.skfabricator.com}
      - Jwt__Audience=${JWT_PROD_AUDIENCE:-skfabricator-prod-client}
      - Jwt__Key=${JWT_PROD_SECRET}
      - CloudinarySettings__CloudName=${CLOUDINARY_PROD_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_PROD_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_PROD_API_SECRET}
      - CloudinarySettings__Folder=sk-fabricator/production
      - SmtpSettings__Username=${SMTP_PROD_USERNAME}
      - SmtpSettings__Password=${SMTP_PROD_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: false
