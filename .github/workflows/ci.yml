name: Backend CI & Security Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Restore Dependencies
        run: dotnet restore SkFabricatorAndErector.slnx

      - name: Build Solution
        run: dotnet build SkFabricatorAndErector.slnx --no-restore -c Release

      - name: Execute Unit & Integration Tests
        run: dotnet test SkFabricatorAndErector.slnx --no-build -c Release --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skfabricator-api:test

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'skfabricator-api:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
