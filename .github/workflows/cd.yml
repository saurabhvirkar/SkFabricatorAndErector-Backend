name: CD — Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & Build (verify before deploy)
        run: |
          dotnet restore SkFabricatorAndErector.slnx
          dotnet build SkFabricatorAndErector.slnx --no-restore -c Release

      - name: Run full test suite
        run: dotnet test SkFabricatorAndErector.slnx --no-build -c Release --logger "console;verbosity=minimal"

      - name: Trigger Render Deploy Hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
