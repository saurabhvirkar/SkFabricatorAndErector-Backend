name: Deploy Backend to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-prod:
    name: Build & Deploy Production Container
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skfabricator-api:prod-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/skfabricator-api:prod-latest

      - name: Deploy to Production Oracle VM via SSH with Automatic Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: deployer
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /opt/skfabricator/prod || exit 1
            chmod +x ./deploy.sh ./rollback.sh ./health-check.sh
            ./deploy.sh prod-${{ github.sha }}
