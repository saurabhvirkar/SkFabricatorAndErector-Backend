name: Deploy Backend to Render (Production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Trigger Render Production Deployment
    runs-on: ubuntu-latest
    environment: Production # Enforces Manual Approval Gate on GitHub Environment 'Production'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Production Deploy Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning ::RENDER_PROD_API_DEPLOY_HOOK is not set in GitHub Secrets. Skipping webhook trigger."
          else
            echo "Triggering Render Production Deployment..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render Production Deployment Triggered Successfully."
          fi
