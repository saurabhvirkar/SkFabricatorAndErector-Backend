name: Deploy Backend to Render (QA)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-qa:
    name: Trigger Render QA Deployment
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render QA Deploy Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_QA_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning ::RENDER_QA_API_DEPLOY_HOOK is not set in GitHub Secrets. Skipping webhook trigger."
          else
            echo "Triggering Render QA Deployment..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render QA Deployment Triggered Successfully."
          fi
