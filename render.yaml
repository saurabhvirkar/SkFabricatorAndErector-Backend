# ------------------------------------------------------------------------------
# Complete One-Click Render Blueprint Specification for SK Fabricator & Erector
# ------------------------------------------------------------------------------

databases:
  - name: skfabricatordb
    databaseName: skfabricatordb
    user: skfabricatordb_user
    plan: free
    region: singapore

services:
  # ----------------------------------------------------------------------------
  # Service 1: ASP.NET Core Web API (Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: skfabricatorapi
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Connection string pointing directly to Neon PostgreSQL
      - key: DatabaseProvider
        value: PostgreSQL
      - key: ConnectionStrings__DefaultConnection
        value: "postgresql://neondb_owner:npg_B0sVglPD3JqI@ep-crimson-sea-azc9xh4g-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"

      # JWT Authentication Configuration
      - key: Jwt__Issuer
        value: https://skfabricatorapi.onrender.com
      - key: Jwt__Audience
        value: https://skfabricator.onrender.com
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__ExpireDays
        value: "1"
      - key: Jwt__RefreshTokenExpireDays
        value: "7"

      # Cloudinary Media Storage Configuration
      - key: CloudinarySettings__CloudName
        value: dniawq4zi
      - key: CloudinarySettings__ApiKey
        value: "398386795366985"
      - key: CloudinarySettings__ApiSecret
        value: TAeTFMq72Gc0S21jrIg0Baulguo

      # SMTP Email Configuration
      - key: SmtpSettings__Host
        value: smtp.gmail.com
      - key: SmtpSettings__Port
        value: "587"
      - key: SmtpSettings__Username
        sync: false
      - key: SmtpSettings__Password
        sync: false
      - key: SmtpSettings__FromName
        value: "SK Fabricator & Erector"
      - key: SmtpSettings__ToEmail
        sync: false

      # Initial Seed User Passwords (Configured via Render Environment or secure runtime)
      - key: SeedUserPasswords__Admin
        sync: false
      - key: SeedUserPasswords__Manager
        sync: false
      - key: SeedUserPasswords__SuperAdmin
        sync: false

      # Allowed CORS Origins
      - key: AllowedOrigins__0
        value: "https://skfabricator.onrender.com"
      - key: AllowedOrigins__1
        value: "http://localhost:4200"
      - key: AllowedOrigins__2
        value: "https://skfabricatorui.onrender.com"
      - key: AllowedOrigins__3
        value: "https://sk-fabricator.pages.dev"

  # ----------------------------------------------------------------------------
  # Service 2: Angular Frontend UI (Frontend)
  # ----------------------------------------------------------------------------
  - type: web
    name: skfabricator
    plan: free
    env: docker
    repo: https://github.com/saurabhvirkar/SkFabricatorAndErector-Frontend
    dockerfilePath: ./Dockerfile.ui
    region: singapore
    envVars:
      - key: API_URL
        value: https://skfabricatorapi.onrender.com/api
