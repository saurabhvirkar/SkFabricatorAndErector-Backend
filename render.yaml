# ------------------------------------------------------------------------------
# Render Blueprint Specification for SK Fabricator & Erector (Free Tier)
# ------------------------------------------------------------------------------
services:
  # ----------------------------------------------------------------------------
  # Service 1: ASP.NET Core Web API (Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: skfabricatorapi
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080

      # Database Connection String (Configure in Render Dashboard or Environment)
      - key: DatabaseProvider
        value: PostgreSQL
      - key: ConnectionStrings__DefaultConnection
        sync: false

      # JWT Authentication Settings
      - key: Jwt__Issuer
        value: https://skfabricatorapi.onrender.com
      - key: Jwt__Audience
        value: https://skfabricatorui.onrender.com
      - key: Jwt__Key
        sync: false
      - key: Jwt__ExpireDays
        value: "1"
      - key: Jwt__RefreshTokenExpireDays
        value: "7"

      # Cloudinary Media Storage Settings
      - key: CloudinarySettings__CloudName
        sync: false
      - key: CloudinarySettings__ApiKey
        sync: false
      - key: CloudinarySettings__ApiSecret
        sync: false

      # SMTP Email Settings
      - key: SmtpSettings__Host
        value: smtp.gmail.com
      - key: SmtpSettings__Port
        value: "587"
      - key: SmtpSettings__Username
        sync: false
      - key: SmtpSettings__Password
        sync: false
      - key: SmtpSettings__FromName
        value: "SK Fabricator & Erector"
      - key: SmtpSettings__ToEmail
        sync: false

      # Seed User Initial Configuration
      - key: SeedUserPasswords__Admin
        sync: false
      - key: SeedUserPasswords__Manager
        sync: false

      # Allowed CORS Origins
      - key: AllowedOrigins__0
        value: "https://skfabricatorui.onrender.com"
      - key: AllowedOrigins__1
        value: "http://localhost:4200"

  # ----------------------------------------------------------------------------
  # Service 2: Angular Frontend UI
  # ----------------------------------------------------------------------------
  - type: web
    name: skfabricatorui
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.ui
    region: singapore
